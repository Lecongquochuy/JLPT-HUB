<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bộ Chuyển Đổi PDF sang JLPT Data Pro (Tự Động Toàn Phần)</title>
    <!-- Thư viện đọc PDF trực tiếp trên trình duyệt -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
      :root {
        --bg-dark: #090d16;
        --card-bg: #131c2e;
        --accent: #38bdf8;
        --accent-glow: rgba(56, 189, 248, 0.25);
        --accent-green: #22c55e;
        --accent-amber: #f59e0b;
        --border: #223049;
        --border-highlight: #33496d;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      }
      body {
        background: var(--bg-dark);
        color: var(--text-main);
        line-height: 1.6;
        padding: 30px 20px 60px;
      }
      .container {
        max-width: 850px;
        margin: 0 auto;
      }

      header {
        text-align: center;
        margin-bottom: 25px;
      }
      h1 {
        color: var(--accent);
        font-size: 1.9rem;
        margin-bottom: 6px;
        font-weight: 800;
      }
      .badge-pro {
        background: var(--accent-amber);
        color: #000;
        font-size: 0.75rem;
        padding: 2px 8px;
        border-radius: 6px;
        font-weight: 800;
        vertical-align: middle;
      }

      .card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 24px;
        margin-bottom: 20px;
      }
      label {
        display: block;
        font-weight: 700;
        margin-bottom: 6px;
        font-size: 0.92rem;
        color: #e2e8f0;
      }
      input,
      select {
        width: 100%;
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg-dark);
        color: #fff;
        margin-bottom: 16px;
        font-size: 0.98rem;
      }
      input:focus, select:focus {
        outline: none;
        border-color: var(--accent);
      }

      .drop-zone {
        border: 2px dashed var(--accent);
        border-radius: 10px;
        padding: 30px 20px;
        text-align: center;
        cursor: pointer;
        transition: 0.2s;
        background: rgba(56, 189, 248, 0.04);
        margin-bottom: 16px;
      }
      .drop-zone:hover {
        background: rgba(56, 189, 248, 0.1);
      }
      .drop-zone strong {
        color: #fff;
        font-size: 1.05rem;
      }
      .drop-zone p {
        color: var(--text-muted);
        font-size: 0.88rem;
        margin-top: 4px;
      }

      .btn {
        padding: 12px 18px;
        font-weight: 700;
        font-size: 1rem;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.15s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .btn-run {
        width: 100%;
        padding: 14px;
        background: var(--accent);
        color: #000;
      }
      .btn-run:hover {
        background: #7dd3fc;
      }
      .btn-run:disabled {
        background: var(--border);
        color: var(--text-muted);
        cursor: not-allowed;
      }

      .progress-container {
        display: none;
        margin-top: 20px;
      }
      .progress-bar-bg {
        width: 100%;
        height: 12px;
        background: var(--border);
        border-radius: 6px;
        overflow: hidden;
        margin-bottom: 8px;
      }
      .progress-bar-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, var(--accent), var(--accent-green));
        transition: width 0.3s;
      }

      .log-box {
        background: #020617;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        height: 200px;
        overflow-y: auto;
        font-family: monospace;
        font-size: 0.85rem;
        color: #a5f3fc;
        white-space: pre-wrap;
        margin-top: 15px;
        line-height: 1.5;
      }

      .action-row {
        display: none;
        margin-top: 18px;
        gap: 10px;
        flex-wrap: wrap;
      }
      .btn-success { background: var(--accent-green); color: #000; }
      .btn-success:hover { background: #4ade80; }
      .btn-amber { background: var(--accent-amber); color: #000; }
      .btn-amber:hover { background: #fbbf24; }
      .btn-secondary { background: #1e293b; color: #fff; border: 1px solid var(--border); }
      .btn-secondary:hover { background: #2d3f5b; }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>⚡ PDF sang JLPT Data Pro <span class="badge-pro">FULL TỰ ĐỘNG</span></h1>
        <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 4px;">
          Tự động đọc PDF Từ vựng, Ngữ pháp, Đọc hiểu & Nghe hiểu ➔ Chuẩn hóa dữ liệu theo cấu trúc JLPT-Hub
        </p>
      </header>

      <div class="card">
        <label>1. Nhập Gemini API Key (Miễn phí từ Google AI Studio):</label>
        <input
          type="password"
          id="apiKey"
          placeholder="Dán mã API Key dạng AIzaSy..."
        />

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;">
          <div>
            <label>2. Thể loại nội dung trong PDF:</label>
            <select id="typeSelect">
              <option value="vocab" selected>📖 Từ vựng (Vocabulary)</option>
              <option value="grammar">📐 Ngữ pháp (Grammar)</option>
              <option value="reading">📰 Đọc hiểu (Reading / Dokkai)</option>
              <option value="listening">🎧 Nghe hiểu (Listening / Choukai)</option>
            </select>
          </div>
          <div>
            <label>3. Cấp độ JLPT:</label>
            <select id="levelSelect">
              <option value="N2" selected>N2</option>
              <option value="N3">N3</option>
              <option value="N1">N1</option>
              <option value="N4">N4</option>
              <option value="N5">N5</option>
            </select>
          </div>
          <div>
            <label>4. Số dòng / đợt gọi AI:</label>
            <select id="batchSize">
              <option value="35" selected>35 dòng / đợt (Khuyên dùng)</option>
              <option value="50">50 dòng / đợt</option>
              <option value="25">25 dòng / đợt (Chi tiết nhất)</option>
            </select>
          </div>
        </div>

        <label>5. Chọn file PDF nguồn:</label>
        <div
          class="drop-zone"
          id="dropZone"
          onclick="document.getElementById('fileInput').click()"
        >
          <strong id="fileName"
            >📄 Nhấp để chọn file hoặc kéo thả file PDF vào đây</strong
          >
          <p>Hỗ trợ file PDF từ vựng, ngữ pháp, đọc hiểu từ thư mục data_pdf</p>
        </div>
        <input type="file" id="fileInput" accept=".pdf" style="display: none" />

        <button class="btn btn-run" id="startBtn" onclick="startConversion()">
          🚀 Bắt đầu trích xuất & Chuẩn hóa tự động
        </button>

        <div class="progress-container" id="progressArea">
          <div
            style="
              display: flex;
              justify-content: space-between;
              font-size: 0.9rem;
              margin-bottom: 4px;
            "
          >
            <span id="progressStatus">Đang chuẩn bị...</span>
            <span id="progressPercent">0%</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar"></div>
          </div>
        </div>

        <div class="log-box" id="logBox">Sẵn sàng chờ lệnh...</div>

        <!-- Các nút xử lý sau khi hoàn tất -->
        <div class="action-row" id="actionRow">
          <button class="btn btn-success" style="flex:1;" onclick="applyDirectlyToHub()">
            ⚡ Nạp thẳng vào Web JLPT-Hub
          </button>
          <button class="btn btn-amber" style="flex:1;" onclick="downloadDataFile()">
            💾 Tải về file data.js / data/n*.js
          </button>
          <button class="btn btn-secondary" style="flex:1;" onclick="copyJSONToClipboard()">
            📋 Copy JSON chuẩn
          </button>
        </div>
      </div>
    </div>

    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      let selectedFile = null;
      let accumulatedData = [];

      const savedKey = localStorage.getItem("GEMINI_TEMP_KEY");
      if (savedKey) document.getElementById("apiKey").value = savedKey;

      const fileInput = document.getElementById("fileInput");
      const dropZone = document.getElementById("dropZone");

      fileInput.addEventListener("change", (e) => {
        if (e.target.files.length) handleFile(e.target.files[0]);
      });
      dropZone.addEventListener("dragover", (e) => e.preventDefault());
      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
      });

      function handleFile(file) {
        if (file.type !== "application/pdf") {
          alert("Vui lòng chỉ tải lên file định dạng PDF!");
          return;
        }
        selectedFile = file;
        document.getElementById("fileName").textContent =
          `✅ Đã chọn: ${file.name} (${(file.size / 1024 / 1024).toFixed(1)} MB)`;
      }

      function addLog(msg) {
        const log = document.getElementById("logBox");
        log.textContent += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
        log.scrollTop = log.scrollHeight;
      }

      async function extractTextFromPDF(file) {
        addLog("Đang đọc nội dung trang từ PDF...");
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let fullText = "";

        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          const pageStr = content.items.map((item) => item.str).join(" ");
          if (pageStr.trim().length > 10) {
            fullText += pageStr + "\n";
          }
        }

        const lines = fullText
          .split(/[\r\n]+/)
          .map((l) => l.trim())
          .filter((l) => l.length > 1 && !/^\d+$/.test(l));

        return lines;
      }

      function buildPrompt(category, level, batch, fileName) {
        const batchText = batch.join("\n");
        if (category === "vocab") {
          return `
Bạn là chuyên gia ngữ liệu tiếng Nhật JLPT ${level}.
Dưới đây là một phần nội dung trích xuất từ tài liệu từ vựng (${fileName}):
${batchText}

Hãy lọc ra tất cả các từ vựng tiếng Nhật và phân tích chi tiết.
Chỉ trả về DUY NHẤT một mảng JSON (Array) đúng chuẩn cú pháp, KHÔNG bọc văn bản giải thích thừa.
[
  {
    "id": "v_${Date.now()}_" + Math.random().toString(36).substr(2, 4),
    "level": "${level}",
    "source": "${fileName}",
    "tag": "từ mới",
    "word": "Kanji/Kana",
    "reading": "Cách đọc Hiragana",
    "hanviet": "ÂM HÁN VIỆT IN HOA",
    "meaning": "Nghĩa tiếng Việt chuẩn",
    "exJ": "Câu ví dụ tiếng Nhật",
    "exV": "Dịch nghĩa câu ví dụ",
    "note": "Collocations, phân biệt từ gần nghĩa, mẹo nhớ"
  }
]`;
        } else if (category === "grammar") {
          return `
Bạn là chuyên gia ngữ pháp tiếng Nhật JLPT ${level}.
Dưới đây là một phần nội dung trích xuất từ tài liệu ngữ pháp (${fileName}):
${batchText}

Hãy lọc ra tất cả các cấu trúc ngữ pháp và phân tích chi tiết.
Chỉ trả về DUY NHẤT một mảng JSON (Array):
[
  {
    "id": "g_${Date.now()}_" + Math.random().toString(36).substr(2, 4),
    "level": "${level}",
    "source": "${fileName}",
    "structure": "Tên cấu trúc (〜...)",
    "meaning": "Nghĩa tiếng Việt",
    "formation": "Công thức kết nối (V/A/N + ...)",
    "exJ": "Câu ví dụ tiếng Nhật",
    "exV": "Dịch câu ví dụ",
    "note": "Sắc thái, lưu ý, phân biệt cấu trúc tương đương"
  }
]`;
        } else if (category === "reading") {
          return `
Bạn là chuyên gia đọc hiểu tiếng Nhật JLPT ${level}.
Dưới đây là nội dung trích xuất từ tài liệu đọc hiểu (${fileName}):
${batchText}

Hãy tái cấu trúc thành bài đọc hiểu chuẩn JLPT có trắc nghiệm.
Chỉ trả về DUY NHẤT một mảng JSON (Array):
[
  {
    "id": "r_${Date.now()}_" + Math.random().toString(36).substr(2, 4),
    "level": "${level}",
    "source": "${fileName}",
    "title": "Tiêu đề bài đọc",
    "passage": "Nội dung đoạn văn tiếng Nhật (giữ nguyên xuống dòng)",
    "translation": "Bản dịch tiếng Việt toàn bài mượt mà",
    "vocabHints": ["Từ 1 (cách đọc): Nghĩa", "Từ 2 (cách đọc): Nghĩa"],
    "questions": [
      {
        "q": "Nội dung câu hỏi tiếng Nhật",
        "options": ["1. ...", "2. ...", "3. ...", "4. ..."],
        "answer": 0,
        "explanation": "Giải thích chi tiết tại sao đúng"
      }
    ]
  }
]`;
        } else {
          return `
Bạn là chuyên gia luyện thi nghe hiểu tiếng Nhật JLPT ${level}.
Phân tích tài liệu nghe hiểu (${fileName}):
${batchText}
Chỉ trả về DUY NHẤT một mảng JSON bài đọc hiểu / bài luyện phản xạ:
[
  {
    "id": "l_${Date.now()}_" + Math.random().toString(36).substr(2, 4),
    "level": "${level}",
    "source": "${fileName}",
    "title": "Mẹo & Bài tập Nghe Hiểu",
    "passage": "Nội dung lời thoại (Script) hoặc phương pháp làm bài",
    "translation": "Bản dịch tiếng Việt",
    "vocabHints": ["Từ khóa nghe: Nghĩa"],
    "questions": [
      {
        "q": "Câu hỏi kiểm tra",
        "options": ["1. ...", "2. ...", "3. ...", "4. ..."],
        "answer": 0,
        "explanation": "Giải thích từ khóa quyết định đáp án đúng"
      }
    ]
  }
]`;
        }
      }

      async function callGemini(prompt, apiKey) {
        // Hỗ trợ thử cả gemini-2.5-flash và gemini-1.5-flash
        const models = ["gemini-2.5-flash", "gemini-1.5-flash", "gemini-2.0-flash"];
        let lastError = null;

        for (const model of models) {
          try {
            const response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: prompt }] }],
                  generationConfig: { responseMimeType: "application/json" },
                }),
              }
            );

            if (!response.ok) {
              const err = await response.json();
              throw new Error(err.error?.message || `HTTP ${response.status}`);
            }

            const data = await response.json();
            const textRes = data.candidates[0].content.parts[0].text;
            return JSON.parse(textRes);
          } catch (e) {
            lastError = e;
          }
        }
        throw lastError || new Error("Không thể gọi Gemini API");
      }

      async function startConversion() {
        const apiKey = document.getElementById("apiKey").value.trim();
        if (!apiKey) {
          alert("Vui lòng nhập Gemini API Key!");
          return;
        }
        if (!selectedFile) {
          alert("Vui lòng chọn file PDF!");
          return;
        }

        localStorage.setItem("GEMINI_TEMP_KEY", apiKey);
        const category = document.getElementById("typeSelect").value;
        const level = document.getElementById("levelSelect").value;
        const batchSize = parseInt(document.getElementById("batchSize").value);

        const startBtn = document.getElementById("startBtn");
        const progressArea = document.getElementById("progressArea");
        const progressBar = document.getElementById("progressBar");
        const progressPercent = document.getElementById("progressPercent");
        const progressStatus = document.getElementById("progressStatus");
        const actionRow = document.getElementById("actionRow");

        startBtn.disabled = true;
        actionRow.style.display = "none";
        progressArea.style.display = "block";
        accumulatedData = [];

        try {
          const extractedLines = await extractTextFromPDF(selectedFile);
          addLog(`Đã đọc xong ${extractedLines.length} dòng văn bản từ PDF.`);

          const batches = [];
          for (let i = 0; i < extractedLines.length; i += batchSize) {
            batches.push(extractedLines.slice(i, i + batchSize));
          }

          addLog(`Chia thành ${batches.length} đợt xử lý (${category.toUpperCase()}).`);

          for (let idx = 0; idx < batches.length; idx++) {
            const currentBatch = batches[idx];
            progressStatus.textContent = `Đang xử lý đợt ${idx + 1} / ${batches.length}...`;
            addLog(`Đang gửi đợt ${idx + 1} (${currentBatch.length} dòng)...`);

            try {
              const prompt = buildPrompt(category, level, currentBatch, selectedFile.name);
              const result = await callGemini(prompt, apiKey);
              if (Array.isArray(result)) {
                accumulatedData.push(...result);
                addLog(`-> Đợt ${idx + 1} thành công: +${result.length} mục mới.`);
              }
            } catch (err) {
              addLog(`⚠️ Đợt ${idx + 1} gặp lỗi: ${err.message}. Đang tiếp tục...`);
            }

            const percent = Math.round(((idx + 1) / batches.length) * 100);
            progressBar.style.width = `${percent}%`;
            progressPercent.textContent = `${percent}%`;

            await new Promise((r) => setTimeout(r, 2000));
          }

          addLog(`🎉 HOÀN TẤT TOÀN BỘ! Tổng cộng thu được ${accumulatedData.length} mục (${category}).`);
          progressStatus.textContent = "Hoàn tất!";
          actionRow.style.display = "flex";
        } catch (error) {
          addLog(`❌ Đã xảy ra lỗi: ${error.message}`);
          alert("Có lỗi xảy ra: " + error.message);
        } finally {
          startBtn.disabled = false;
        }
      }

      function applyDirectlyToHub() {
        const category = document.getElementById("typeSelect").value;
        const targetKey = (category === 'reading' || category === 'listening') ? 'reading' : category;
        const currentExtra = JSON.parse(localStorage.getItem("JLPT_EXTRA_DATA") || '{"vocab":[],"grammar":[],"reading":[]}');

        if (!currentExtra[targetKey]) currentExtra[targetKey] = [];
        currentExtra[targetKey].push(...accumulatedData);

        localStorage.setItem("JLPT_EXTRA_DATA", JSON.stringify(currentExtra));
        alert(`🎉 Đã nạp thành công ${accumulatedData.length} mục vào Web JLPT-Hub! Bạn chỉ cần tải lại trang index.html là thấy ngay.`);
      }

      function downloadDataFile() {
        const category = document.getElementById("typeSelect").value;
        const level = document.getElementById("levelSelect").value;
        const targetKey = (category === 'reading' || category === 'listening') ? 'reading' : category;

        const fullDataObj = { vocab: [], grammar: [], reading: [] };
        fullDataObj[targetKey] = accumulatedData;

        const fileContent = `// Dữ liệu tự động xuất từ công cụ Converter (${level})\nwindow.JLPT_DATA_${level} = ` +
          JSON.stringify(fullDataObj, null, 2) + ";\n";
        
        const blob = new Blob([fileContent], { type: "text/javascript;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${level.toLowerCase()}.js`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      function copyJSONToClipboard() {
        const category = document.getElementById("typeSelect").value;
        const targetKey = (category === 'reading' || category === 'listening') ? 'reading' : category;
        const payload = { vocab: [], grammar: [], reading: [] };
        payload[targetKey] = accumulatedData;

        navigator.clipboard.writeText(JSON.stringify(payload, null, 2)).then(() => {
          alert("📋 Đã copy khối JSON chuẩn vào Clipboard! Bạn có thể dán vào nút '+ Dán Data từ Agent' trên web.");
        });
      }
    </script>
  </body>
</html>
